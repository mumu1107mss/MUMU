    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* --- 🌸 全局视觉系统：莫奈晨雾系 --- */
        :root {
            --primary: #d291bc; /* 莫奈紫粉 */
            --primary-dark: #a66c91;
            --accent: #95e1d3; /* 晨雾绿 */
            --text-main: #5d4037; /* 深褐 */
            --text-light: #8d6e63; /* 浅褐 */
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            /* 高级磨砂玻璃参数 */
            --glass-bg: rgba(255, 255, 255, 0.82);
            --glass-border: 1px solid rgba(255, 255, 255, 0.9);
            --shadow: 0 15px 35px rgba(210, 145, 188, 0.15);
            --font-stack: "Noto Serif SC", "Songti SC", serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-stack);
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- 🌷 背景花朵网格 (绝对均匀分布) --- */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            /* PC端：6列 x 5行 = 30个格子，完美覆盖 */
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(5, 1fr);
            z-index: 0;
            pointer-events: none; /* 鼠标穿透 */
            opacity: 0.4; /* 淡淡的纹理感 */
        }

        .bg-flower {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.8rem;
            filter: grayscale(15%) sepia(10%);
            transition: transform 3s ease-in-out;
            cursor: default;
        }
        
        /* 背景呼吸浮动动画 */
        .bg-flower:nth-child(odd) { animation: float 7s ease-in-out infinite; }
        .bg-flower:nth-child(even) { animation: float 8s ease-in-out infinite reverse; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* --- 🪷 主容器 --- */
        .container {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 750px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 24px;
            border: var(--glass-border);
            box-shadow: var(--shadow);
            padding: 45px;
            text-align: center;
            transition: opacity 0.4s ease;
            margin: 30px 0;
        }

        .hidden { display: none !important; }

        /* 标题排版 */
        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, #d291bc, #e17055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: var(--primary);
            letter-spacing: 3px;
            font-weight: 700;
        }

        h2 { font-size: 1.4rem; font-weight: normal; color: var(--text-main); margin-bottom: 25px; line-height: 1.4; }
        
        p { line-height: 1.9; color: var(--text-light); margin-bottom: 20px; font-size: 1.05rem; }

        /* 按钮交互 */
        .btn {
            background: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            border: none;
            border-radius: 50px;
            padding: 16px 45px;
            color: white;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 8px 20px rgba(253, 160, 133, 0.35);
            letter-spacing: 1px;
            margin-top: 25px;
            width: 100%;
            max-width: 320px;
        }

        .btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 25px rgba(253, 160, 133, 0.5); }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { background: #e0e0e0; color: #999; cursor: not-allowed; box-shadow: none; transform: none; }

        /* 选项卡片 */
        .option-btn {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid white;
            border-radius: 16px;
            padding: 18px 25px;
            margin-bottom: 14px;
            width: 100%;
            text-align: left;
            font-size: 1.05rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            font-family: "Lato", sans-serif; /* 选项稍微现代一点 */
        }

        .option-btn:hover {
            background: #fff;
            transform: translateX(6px);
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(210, 145, 188, 0.15);
        }

        .option-btn.selected {
            background: linear-gradient(to right, rgba(210, 145, 188, 0.1), rgba(255,255,255,0.8));
            color: var(--primary-dark);
            border-color: var(--primary);
            font-weight: 600;
        }

        /* 进度指示 */
        #progress-text {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* 底部版权 */
        .footer {
            margin-top: 50px;
            font-size: 0.85rem;
            color: #b0bec5;
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-top: 20px;
        }
        .warning { color: #e57373; font-weight: 600; display: block; margin-top: 6px; }

        /* --- 结果页特有样式 --- */
        #result-emoji {
            font-size: 7.5rem;
            margin: 10px 0 25px 0;
            /* 绽放动画 */
            animation: bloom 2.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            filter: drop-shadow(0 10px 20px rgba(210, 145, 188, 0.2));
        }
        
        @keyframes bloom {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .result-card {
            background: rgba(255,255,255,0.65);
            border-radius: 18px;
            padding: 25px 30px;
            margin-bottom: 22px;
            text-align: left;
            border: 1px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }

        .result-card h3 {
            color: var(--primary-dark);
            border-left: 4px solid var(--accent);
            padding-left: 12px;
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.15rem;
        }
        
        .result-card p {
            margin-bottom: 0;
            text-align: justify;
            font-size: 1rem;
        }

        #result-name { font-size: 2.4rem; color: var(--text-main); margin-bottom: 10px; font-weight: 700; }
        #result-keywords { font-size: 1.1rem; color: var(--primary); margin-bottom: 30px; letter-spacing: 1px; }

        /* --- 移动端适配 --- */
        @media (max-width: 600px) {
            .bg-grid {
                grid-template-columns: repeat(5, 1fr); /* 手机端5列 */
                grid-template-rows: repeat(6, 1fr);    /* 手机端6行 */
            }
            .bg-flower { font-size: 2.2rem; }
            .container { padding: 30px 20px; width: 95%; margin: 15px 0; }
            h1 { font-size: 1.8rem; }
            #result-emoji { font-size: 6rem; }
            .btn { width: 100%; padding: 14px 0; }
        }
    </style>
</head>

        { text: "5. 在一个全是陌生人的聚会上，你会怎么做？", options: [{t:"主动绽放自信的笑容，寻找看起来友善的人开启话题",p:"E"}, {t:"像含苞待放的花朵一样，在角落等待别人先靠近",p:"I"}, {t:"热情地向大家介绍自己，迅速融入圈子",p:"E"}, {t:"保持礼貌的微笑和距离，观察周围的环境",p:"I"}] },
        { text: "6. 你的心情通常更容易被哪种天气所影响或代表？", options: [{t:"艳阳高照、万里无云的晴天",p:"E"}, {t:"阴雨绵绵、适合听雨的雨天",p:"I"}, {t:"微风拂面、生机勃勃的春天",p:"E"}, {t:"落叶纷飞、略带萧瑟的秋天",p:"I"}] },
        { text: "7. 打开你的手机社交软件，通常是什么状态？", options: [{t:"消息红点99+，各种群聊都很活跃，回复不过来",p:"E"}, {t:"常年开启免打扰模式，消息随缘回复，甚至经常意念回复",p:"I"}, {t:"朋友圈几乎日更，乐于分享生活的点点滴滴",p:"E"}, {t:"朋友圈三天可见，或者仅自己可见，很少发动态",p:"I"}] },
        { text: "8. 在一个团队或群体活动中，你通常扮演的角色是？", options: [{t:"积极的组织者、领导者或核心人物",p:"E"}, {t:"冷静的观察者、配合者或执行者",p:"I"}, {t:"负责搞气氛、让大家开心的担当",p:"E"}, {t:"默默做事、不求关注的“透明人”",p:"I"}] },
        { text: "9. 遇到非常不开心的事情，你的第一反应是？", options: [{t:"马上找朋友倾诉，把苦水全部倒出来就好了",p:"E"}, {t:"自己消化，躲进壳里，不想让任何人知道",p:"I"}, {t:"通过大吃一顿、疯狂购物或运动来发泄",p:"E"}, {t:"写日记、听悲伤的歌，分析情绪的来源",p:"I"}] },
        { text: "10. 你内心深处更向往哪种意境的生活？", options: [{t:"繁花似锦，烈火烹油，热烈而精彩",p:"E"}, {t:"幽兰空谷，清风明月，清净而自在",p:"I"}, {t:"每天都有新鲜事发生，充满变数",p:"E"}, {t:"每天都安稳有序，岁月静好",p:"I"}] },
        { text: "11. 关于分享秘密这件小事，你的习惯是？", options: [{t:"心里藏不住话，容易因为信任而说漏嘴",p:"E"}, {t:"守口如瓶，是一个非常好的“树洞”",p:"I"}, {t:"喜欢交换信息，觉得这是拉近关系的方式",p:"E"}, {t:"连自己的秘密都很少说，防备心较强",p:"I"}] },
        { text: "12. 你如何看待“孤独”这种状态？", options: [{t:"一种折磨，需要通过社交来摆脱",p:"E"}, {t:"一种享受，是自我充电的最佳时刻",p:"I"}, {t:"偶尔可以，但时间长了会受不了",p:"E"}, {t:"人生的常态，也是自由的代价",p:"I"}] },
        { text: "13. 在KTV或者大型聚会里，你通常在做什么？", options: [{t:"麦霸，每首歌都会唱，或者在那拼酒",p:"E"}, {t:"坐在角落玩手机、吃水果，观察大家",p:"I"}, {t:"负责摇骰子、组织游戏，搞热气氛",p:"E"}, {t:"虽然人在那里，但心里只想早点回家",p:"I"}] },
        { text: "14. 你做决定的速度通常是怎样的？", options: [{t:"很快，直觉告诉我该怎么做，当场拍板",p:"E"}, {t:"很慢，需要反复权衡利弊，犹豫不决",p:"I"}, {t:"喜欢听取大家的意见，综合考虑",p:"E"}, {t:"只听从内心的声音，不受外界干扰",p:"I"}] },
        { text: "15. 如果用自然元素形容自己，你觉得自己更像？", options: [{t:"一团燃烧的火，温暖甚至灼热",p:"E"}, {t:"一块坚硬的冰，保持冷静和距离",p:"I"}, {t:"一阵自由的风，无拘无束",p:"E"}, {t:"一棵扎根的树，沉默且坚定",p:"I"}] },
        
        // T/F (16-30)
        { text: "16. 看到路边有一只可怜的流浪猫，你会？", options: [{t:"思考怎么联系救助机构或寻找领养",p:"T"}, {t:"心都要化了，第一反应是想带回家养",p:"F"}, {t:"理性分析自己目前的条件是否适合养猫",p:"T"}, {t:"不管那么多，先喂它点吃的，陪它玩一会",p:"F"}] },
        { text: "17. 很好的朋友向你借一笔钱，你会？", options: [{t:"问清楚用途，甚至要求写个借条",p:"T"}, {t:"关系这么好，借就借吧，不好意思拒绝",p:"F"}, {t:"心里默默评估他还钱的能力和风险",p:"T"}, {t:"担心不借会伤感情，哪怕自己吃紧也借",p:"F"}] },
        { text: "18. 看电影或电视剧时，你更关注什么？", options: [{t:"剧情逻辑是否有漏洞，推理是否严密",p:"T"}, {t:"演员的情感是否到位，能否引起共鸣",p:"F"}, {t:"导演的拍摄手法、剪辑和构图技巧",p:"T"}, {t:"故事本身是否感人，是否打动人心",p:"F"}] },
        { text: "19. 当你面对别人的批评时，你的第一反应？", options: [{t:"冷静分析他说得对不对，有则改之",p:"T"}, {t:"感到委屈、难过，甚至想哭",p:"F"}, {t:"思考如何改进，下次做得更好",p:"T"}, {t:"觉得对方是不是不喜欢我，针对我",p:"F"}] },
        { text: "20. 你认为什么是真正的“真理”？", options: [{t:"客观存在的、可被验证的科学规律",p:"T"}, {t:"每个人主观感受到的、坚信的信念",p:"F"}, {t:"逻辑自洽的、没有矛盾的体系",p:"T"}, {t:"充满爱与关怀的、能温暖人心的力量",p:"F"}] },
        { text: "21. 假如你要在自家院子里种花，你会？", options: [{t:"科学规划种植密度、花期搭配和光照分区",p:"T"}, {t:"凭感觉种，喜欢什么种什么，乱一点也美",p:"F"}, {t:"先研究土壤酸碱度，购买专业的肥料",p:"T"}, {t:"每天对着花说话，给它们放音乐听",p:"F"}] },
        { text: "22. 与人发生激烈的争论时，你？", options: [{t:"摆事实讲道理，试图以理服人",p:"T"}, {t:"容易情绪激动，声音变大，甚至气哭",p:"F"}, {t:"敏锐地指出对方话语中的逻辑谬误",p:"T"}, {t:"为了维护关系和谐，选择妥协或闭嘴",p:"F"}] },
        { text: "23. 在工作或生活中，你觉得自己更擅长处理？", options: [{t:"复杂的数据、信息和抽象的概念",p:"T"}, {t:"微妙的人际关系和复杂的情绪",p:"F"}, {t:"制定详细的计划和规则",p:"T"}, {t:"提供情绪价值和安慰",p:"F"}] },
        { text: "24. 去花店买花，你挑选的标准是？", options: [{t:"花期长短、是否好养、是否新鲜",p:"T"}, {t:"第一眼的感觉、颜色是否喜欢、缘分",p:"F"}, {t:"性价比高不高，价格是否合理",p:"T"}, {t:"花语和寓意是否美好，能否代表心情",p:"F"}] },
        { text: "25. 你更希望别人如何评价你？", options: [{t:"聪明、能干、专业、逻辑强",p:"T"}, {t:"温柔、善良、美好、共情能力强",p:"F"}, {t:"有思想、有深度、不仅是花瓶",p:"T"}, {t:"懂生活、有情趣、是个有趣的灵魂",p:"F"}] },
        { text: "26. 遇到一个棘手的困难，你首先会？", options: [{t:"寻找技术上的解决方案，分析问题根源",p:"T"}, {t:"寻求亲友的情感支持，缓解焦虑",p:"F"}, {t:"将大问题拆解成小步骤逐一解决",p:"T"}, {t:"先调整自己的心态，告诉自己能行",p:"F"}] },
        { text: "27. 你如何看待“规则”？", options: [{t:"必须遵守，没有规矩不成方圆",p:"T"}, {t:"可以通融，要看具体情况和人情",p:"F"}, {t:"规则是效率和公平的保障",p:"T"}, {t:"有时规则太冷酷无情，需要打破",p:"F"}] },
        { text: "28. 你的办公桌或书桌通常是什么状态？", options: [{t:"井井有条，文件分类清晰，一目了然",p:"T"}, {t:"摆满可爱的装饰品、照片，有点乱",p:"F"}, {t:"极简主义，只放必要的东西",p:"T"}, {t:"乱但温馨，有一种只有自己懂的秩序",p:"F"}] },
        { text: "29. 面对离别（分手或朋友离开），你？", options: [{t:"冷静接受，告诉自己这是自然规律",p:"T"}, {t:"依依不舍，泪流满面，很久走不出来",p:"F"}, {t:"思考下一步的安排，生活还得继续",p:"T"}, {t:"沉浸在悲伤的回忆中，反复咀嚼",p:"F"}] },
        { text: "30. 在做重大抉择时，你更相信？", options: [{t:"大脑的理性判断和利弊分析",p:"T"}, {t:"心底的直觉和第一反应",p:"F"}, {t:"权威的科学数据和统计",p:"T"}, {t:"冥冥之中的命运安排和缘分",p:"F"}] },

        // Style (31-45)
        { text: "31. 如果你真的是一朵花，你希望自己长成什么样？", options: [{t:"雍容华贵，艳压群芳，做花中之王",p:"Royal"}, {t:"清新自然，随风摇曳，充满野性美",p:"Wild"}, {t:"清雅高洁，遗世独立，不与世俗同流",p:"Zen"}, {t:"浪漫梦幻，粉色泡泡，人见人爱",p:"Romantic"}] },
        { text: "32. 你平时喜欢的穿衣风格更偏向？", options: [{t:"大牌设计，质感高级，剪裁考究",p:"Royal"}, {t:"波西米亚，棉麻质地，自由舒适",p:"Wild"}, {t:"极简主义，黑白灰，性冷淡风",p:"Zen"}, {t:"独特小众，设计感强，绝不撞衫",p:"Unique"}] },
        { text: "33. 如果送你一张机票，你最想去哪里？", options: [{t:"巴黎、迪拜、纽约等繁华时尚都市",p:"Royal"}, {t:"非洲草原、亚马逊雨林或无人海岛",p:"Wild"}, {t:"京都寺庙、深山道观或西藏",p:"Zen"}, {t:"普罗旺斯薰衣草花田或迪士尼乐园",p:"Romantic"}] },
        { text: "34. 翻看你的朋友圈，通常发的是什么内容？", options: [{t:"精致的下午茶、高档餐厅或成就展示",p:"Royal"}, {t:"搞怪自拍、户外风景或旅行记录",p:"Wild"}, {t:"富有哲理的一句话、书摘或空镜",p:"Zen"}, {t:"充满艺术感的摄影作品或小众音乐",p:"Unique"}] },
        { text: "35. 刚认识的朋友对你的第一印象通常是？", options: [{t:"气场强大，有点高冷，不敢轻易靠近",p:"Royal"}, {t:"好相处，自来熟，没有什么架子",p:"Wild"}, {t:"温柔文静，说话轻声细语，很有礼貌",p:"Romantic"}, {t:"有个性，酷酷的，很难捉摸",p:"Unique"}] },
        { text: "36. 你的房间装饰风格更接近？", options: [{t:"欧式宫廷风，复古奢华，有水晶灯",p:"Royal"}, {t:"田园风，原木色，摆满了各种植物",p:"Wild"}, {t:"新中式或日式诧寂风，留白很多",p:"Zen"}, {t:"ins风，有很多少女心的摆件和灯串",p:"Romantic"}] },
        { text: "37. 你耳机里常听的音乐类型是？", options: [{t:"古典乐、歌剧或气势磅礴的交响乐",p:"Royal"}, {t:"摇滚、民谣或节奏感强的流行歌",p:"Wild"}, {t:"轻音乐、白噪音、古琴或冥想音乐",p:"Zen"}, {t:"爵士、独立小众音乐或实验电子",p:"Unique"}] },
        { text: "38. 你理想中的恋爱关系模式是？", options: [{t:"势均力敌，强强联合，像国王与王后",p:"Royal"}, {t:"一起疯一起玩，无拘无束，浪迹天涯",p:"Wild"}, {t:"相敬如宾，平淡是真，灵魂伴侣",p:"Zen"}, {t:"像偶像剧一样的浪漫情节，充满惊喜",p:"Romantic"}] },
        { text: "39. 当你遇到非常不公平的事情时，你会？", options: [{t:"利用自己的资源和地位去解决",p:"Royal"}, {t:"直接冲上去理论，大吵一架也不怕",p:"Wild"}, {t:"看淡一切，不予计较，吃亏是福",p:"Zen"}, {t:"用一种非常独特、意想不到的方式反击",p:"Unique"}] },
        { text: "40. 在你的人生价值观里，什么最重要？", options: [{t:"尊严、面子和影响力",p:"Royal"}, {t:"自由、快乐和体验",p:"Wild"}, {t:"内心的平静和精神的超脱",p:"Zen"}, {t:"独特、自我和不可替代性",p:"Unique"}] },
        { text: "41. 你平时更喜欢读什么类型的书？", options: [{t:"名人传记、管理学、成功学",p:"Royal"}, {t:"游记、科幻小说、冒险故事",p:"Wild"}, {t:"哲学、宗教、心理学",p:"Zen"}, {t:"诗歌、散文、言情小说",p:"Romantic"}] },
        { text: "42. 你的社交圈子大概是怎样的？", options: [{t:"精英圈层，都是各行各业的大佬",p:"Royal"}, {t:"三教九流都有，朋友遍天下",p:"Wild"}, {t:"君子之交淡如水，很少社交",p:"Zen"}, {t:"只有几个真正懂我的知己，极其挑剔",p:"Unique"}] },
        { text: "43. 你对“名利”的态度是？", options: [{t:"渴望成功，希望能站在顶峰",p:"Royal"}, {t:"够花就行，开心最重要，不想太累",p:"Wild"}, {t:"身外之物，生不带来死不带去",p:"Zen"}, {t:"那是庸俗的东西，我不屑一顾",p:"Unique"}] },
        { text: "44. 如果选一款香水，你偏好？", options: [{t:"馥郁的花香调，留香很久",p:"Royal"}, {t:"清新的柑橘调或海洋调",p:"Wild"}, {t:"沉稳的木质调或檀香",p:"Zen"}, {t:"神秘的东方调或药感",p:"Unique"}] },
        { text: "45. 如果要用一个词形容你的灵魂？", options: [{t:"高贵",p:"Royal"}, {t:"野性",p:"Wild"}, {t:"佛系",p:"Zen"}, {t:"怪诞",p:"Unique"}] },

        // Speed (46-60)
        { text: "46. 接到一个从未做过的新任务，你会？", options: [{t:"马上开始做，先完成再说，边做边改",p:"Fast"}, {t:"先构思几天，查阅资料，不着急下手",p:"Slow"}, {t:"追求效率，哪怕粗糙一点也没关系",p:"Fast"}, {t:"力求完美，慢工出细活，细节控",p:"Slow"}] },
        { text: "47. 你觉得自己是急性子还是慢性子？", options: [{t:"超级急，最怕磨蹭，走路都带风",p:"Fast"}, {t:"很慢，天塌了也不急，按部就班",p:"Slow"}, {t:"风风火火，想到一出是一出",p:"Fast"}, {t:"温吞水，怎么催都没用",p:"Slow"}] },
        { text: "48. 面对喜欢的限量款商品，你会？", options: [{t:"立刻下单，手慢无，买了再说",p:"Fast"}, {t:"犹豫再三，想想到底需不需要，比价",p:"Slow"}, {t:"冲动消费是常态，经常买完后悔",p:"Fast"}, {t:"理性消费是美德，很少冲动",p:"Slow"}] },
        { text: "49. 平时走路的状态？", options: [{t:"步速很快，经常超车，受不了前面慢",p:"Fast"}, {t:"散步式走路，慢慢悠悠看风景",p:"Slow"}, {t:"不喜欢等红灯，总想冲过去",p:"Fast"}, {t:"经常被人催“快一点”",p:"Slow"}] },
        { text: "50. 你相信一见钟情吗？", options: [{t:"相信，感觉来了挡都挡不住，要抓住",p:"Fast"}, {t:"不信，感情需要时间培养和了解",p:"Slow"}, {t:"爱就要快，不爱就拉倒",p:"Fast"}, {t:"日久生情才是最靠谱的",p:"Slow"}] },
        { text: "51. 收到朋友的消息，你通常？", options: [{t:"秒回，看到就回，无法忍受红点",p:"Fast"}, {t:"意念回复，经常轮回，或者想好再回",p:"Slow"}, {t:"打字很快，或者直接发语音",p:"Fast"}, {t:"经常隔很久才看到消息",p:"Slow"}] },
        { text: "52. 你对自己的人生规划倾向于？", options: [{t:"趁年轻多折腾，早早出名，享受成功",p:"Fast"}, {t:"大器晚成，越老越香，积累经验",p:"Slow"}, {t:"只争朝夕，活在当下",p:"Fast"}, {t:"厚积薄发，长远布局",p:"Slow"}] },
        { text: "53. 吃饭的速度？", options: [{t:"狼吞虎咽，几分钟解决战斗",p:"Fast"}, {t:"细嚼慢咽，享受美食，吃得很慢",p:"Slow"}, {t:"为了填饱肚子，赶时间",p:"Fast"}, {t:"为了品味生活，要有仪式感",p:"Slow"}] },
        { text: "54. 开车或坐车遇到红灯时？", options: [{t:"焦躁不安，恨不得飞过去，一直看灯",p:"Fast"}, {t:"正好休息一下，听听歌，发发呆",p:"Slow"}, {t:"心里默默倒计时，准备起步",p:"Fast"}, {t:"完全不着急，甚至没注意绿灯亮了",p:"Slow"}] },
        { text: "55. 学习一项新技能时？", options: [{t:"报个速成班，希望三天就能学会",p:"Fast"}, {t:"十年磨一剑，愿意花时间打磨基本功",p:"Slow"}, {t:"追求快速上手，能用就行",p:"Fast"}, {t:"追求深度掌握，研究原理",p:"Slow"}] },
        { text: "56. 你的爆发力和耐力？", options: [{t:"爆发力很强，但这股劲过得也快",p:"Fast"}, {t:"爆发力一般，但我耐力好，能坚持",p:"Slow"}, {t:"我是短跑型选手，冲刺厉害",p:"Fast"}, {t:"我是马拉松选手，笑到最后",p:"Slow"}] },
        { text: "57. 面对环境的突然变化？", options: [{t:"迅速适应，甚至有点兴奋，喜欢新鲜",p:"Fast"}, {t:"需要很长的适应期，感到不适和焦虑",p:"Slow"}, {t:"拥抱变化，快速调整策略",p:"Fast"}, {t:"抗拒改变，喜欢熟悉的环境",p:"Slow"}] },
        { text: "58. 你的情绪来去速度？", options: [{t:"来得快去得也快，不记仇",p:"Fast"}, {t:"很难生气，一旦生气很久哄不好",p:"Slow"}, {t:"直肠子，有情绪当场发作",p:"Fast"}, {t:"心里藏事，慢慢消化负面情绪",p:"Slow"}] },
        { text: "59. 如果种花，你会选择？", options: [{t:"那种几天就发芽开花的，要有反馈",p:"Fast"}, {t:"那种要养几年才开花的珍稀品种",p:"Slow"}, {t:"立竿见影的效果",p:"Fast"}, {t:"静待花开的过程",p:"Slow"}] },
        { text: "60. 最后一个问题，你现在想？", options: [{t:"快点告诉我结果！我等不及了！",p:"Fast"}, {t:"希望能给我一个深刻、详细的分析",p:"Slow"}, {t:"迫不及待想截图发朋友圈",p:"Fast"}, {t:"慢慢品味这个测试的过程",p:"Slow"}] }
    ];

    // ==========================================
    // 🚀 逻辑控制引擎
    // ==========================================
    let currentQuestion = 0;
    let scores = { E:0, I:0, T:0, F:0, Royal:0, Wild:0, Zen:0, Romantic:0, Unique:0, Fast:0, Slow:0 };

    // 初始化背景网格
    function initGrid() {
        const grid = document.getElementById('bg-grid');
        // 生成花朵Emoji并填充
        flowerEmojis.forEach(emoji => {
            const div = document.createElement('div');
            div.className = 'bg-flower';
            div.innerText = emoji;
            grid.appendChild(div);
        });
    }

    function startTest() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        const q = questions[currentQuestion];
        document.getElementById('progress-text').innerText = `QUESTION ${currentQuestion + 1} / 60`;
        document.getElementById('question-text').innerText = q.text;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        // 渲染选项，带淡入动画
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.t;
            btn.style.animation = `fadeIn 0.4s ease forwards ${idx * 0.1}s`;
            btn.style.opacity = '0'; 
            btn.onclick = () => selectOption(opt.p);
            container.appendChild(btn);
        });
    }
    
    // 动态添加简单的淡入动画
    const style = document.createElement('style');
    style.innerHTML = `
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    `;
    document.head.appendChild(style);

    function selectOption(point) {
        // 计分
        if (scores[point] !== undefined) scores[point]++;
        
        // 下一题
        currentQuestion++;
        if (currentQuestion < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        // 计算维度逻辑
        const ei = scores.E >= scores.I ? 'E' : 'I';
        const tf = scores.T >= scores.F ? 'T' : 'F';
        const speed = scores.Fast >= scores.Slow ? 'Fast' : 'Slow';
        
        // 风格取最高分，若同分随机
        const styles = ['Royal', 'Wild', 'Zen', 'Romantic', 'Unique'];
        // 简单的随机洗牌防止固定顺序偏好
        styles.sort(() => Math.random() - 0.5);
        const style = styles.reduce((a, b) => scores[a] > scores[b] ? a : b);

        // 生成Key
        const key = `${ei}_${tf}_${style}_${speed}`;
        
        // 兜底逻辑：如果组合意外不存在（极少情况），默认取一个相近的
        const result = flowerData[key] || flowerData['E_F_Romantic_Fast'];

        // 渲染结果
        document.getElementById('result-name').innerText = result.name;
        document.getElementById('result-emoji').innerText = result.emoji;
        document.getElementById('result-keywords').innerText = result.keywords;
        document.getElementById('result-desc').innerText = result.desc;
        document.getElementById('result-analysis').innerText = result.analysis;
        document.getElementById('result-advice').innerText = result.advice;
        
        // 滚动到顶部
        window.scrollTo(0,0);
    }

    // 页面加载启动
    initGrid();

</script>
</body>
</html>
